<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Slider Card demo</title>
<style>
  :root { --primary-color: #03a9f4; --rgb-primary-color: 3,169,244; --primary-text-color: #212121;
          --secondary-text-color: #727272; --disabled-color: #bdbdbd; --error-color: #db4437;
          --deep-orange-color: #ff6f22; --teal-color: #009688; --card-background-color: #fff; }
  body { font-family: Roboto, system-ui, sans-serif; background: #fafafa; color: var(--primary-text-color);
         margin: 0; padding: 16px; display: grid; gap: 16px; max-width: 420px; }
  ha-card { display: block; background: var(--card-background-color); border-radius: 12px;
            border: 1px solid #e0e0e0; }
  #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #555; }
</style>
</head>
<body>
<div id="cards"></div>
<div id="log"></div>
<script type="module">
  // Minimal stand-ins for Home Assistant elements and the hass object
  customElements.define('ha-card', class extends HTMLElement {});
  customElements.define('ha-state-icon', class extends HTMLElement {});
  await import('../range-slider-card.js');

  const log = (s) => (document.getElementById('log').textContent += s + '\n');
  const states = {
    'input_number.flow_min': { state: '30', attributes: { friendly_name: 'Flow min', min: 20, max: 80, step: 1, unit_of_measurement: '°C' } },
    'input_number.flow_max': { state: '63', attributes: { friendly_name: 'Flow max', min: 20, max: 80, step: 1, unit_of_measurement: '°C' } },
    'input_datetime.dhw_start': { state: '06:00:00', attributes: { friendly_name: 'Hot water start', has_time: true, has_date: false } },
    'time.dhw_end': { state: '20:30:00', attributes: { friendly_name: 'Hot water end' } },
    'sensor.bad': { state: '1', attributes: {} },
  };
  const cards = [];
  const hass = () => ({
    states,
    callService: async (domain, service, data) => {
      log(`${domain}.${service} ${JSON.stringify(data)}`);
      const st = states[data.entity_id];
      states[data.entity_id] = { ...st, state: data.time ?? String(data.value) };
      setTimeout(() => cards.forEach((c) => (c.hass = hass())), 150); // HA reports the new state back
    },
  });
  const configs = [
    { start_entity: 'input_number.flow_min', end_entity: 'input_number.flow_max', name: 'Flow temperature', color: 'deep-orange', min_gap: 5 },
    { start_entity: 'input_datetime.dhw_start', end_entity: 'time.dhw_end', name: 'Hot water', step: 30 },
    { start_entity: 'input_number.flow_min', end_entity: 'sensor.bad', name: 'Wrong pair' },
  ];
  for (const cfg of configs) {
    const el = document.createElement('range-slider-card');
    el.setConfig(cfg);
    el.hass = hass();
    document.getElementById('cards').appendChild(el);
    cards.push(el);
  }
  window._cards = cards;
  window._states = states;
</script>
</body>
</html>
